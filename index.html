<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>河流與海岸大富翁 · DSE 地理</title>
<style>
/* 河流與海岸大富翁 — 冷色系 + 立體感 */
:root{
  --bg1:#0a1a2a; --bg2:#0f2c44; --bg3:#163a5f;
  --paper:#f4f8fb; --ink:#22323a; --accent:#2a7f9e; --gold:#d9b25a;
  /* 冷色系方格（沉穩、不刺眼） */
  --c-go:#3d5a6c; --c-chance:#5b4b8a; --c-fate:#8a4b6b; --c-rest:#3f7d6e;
  --c-upper:#2c5f8a; --c-upper2:#1f4a6e;
  --c-middle:#356a8e; --c-middle2:#25527a;
  --c-lower:#3f6f96; --c-lower2:#2e5780;
  --c-ero:#2f8f86; --c-ero2:#1f6f68;
  --c-dep:#3a7e9e; --c-dep2:#2a6486;
  --c-process:#4a7aa8; --c-process2:#355f88;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  font-family:"PingFang HK","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  color:#e8f0f6; min-height:100vh; padding:14px; position:relative;
}
#bg{position:fixed; inset:0; z-index:-2; background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));}
#bg::after{content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 20% 30%,rgba(60,120,160,.25),transparent 40%),
             radial-gradient(circle at 80% 70%,rgba(40,80,140,.25),transparent 40%);}
h1{color:#fff; text-align:center; margin:6px 0 2px; font-size:clamp(20px,3vw,30px); letter-spacing:1px;}
.subtitle{color:#bcd6e6; text-align:center; margin:0 0 12px; font-size:13px;}
.wrap{display:flex; gap:18px; justify-content:center; align-items:flex-start; flex-wrap:wrap;}

/* ---- 棋盤 ---- */
#boardArea{position:relative;}
#board{
  width:min(720px,94vmin); height:min(720px,94vmin);
  display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr);
  gap:5px; padding:8px; border-radius:16px;
  background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1); box-shadow:0 12px 40px rgba(0,0,0,.4);
}
.sq{
  border-radius:9px; padding:5px 4px; font-size:10px; line-height:1.1; color:#eef;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px;
  overflow:hidden; position:relative;
  /* 立體感：上亮下暗 + 內陰影 */
  box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -6px 12px rgba(0,0,0,.35),
              0 3px 6px rgba(0,0,0,.25);
}
.sq .icon{flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));}
.sq .icon svg, .sq .icon .emoji{width:34px; height:34px; display:block;}
.sq .nm{font-weight:700; font-size:10px; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,.6);}
.sq .tag{font-size:8px; opacity:.7; letter-spacing:.5px;}
/* 主題漸層（冷色） */
.sq.upper{background:linear-gradient(155deg,var(--c-upper),var(--c-upper2));}
.sq.middle{background:linear-gradient(155deg,var(--c-middle),var(--c-middle2));}
.sq.lower{background:linear-gradient(155deg,var(--c-lower),var(--c-lower2));}
.sq.ero{background:linear-gradient(155deg,var(--c-ero),var(--c-ero2));}
.sq.dep{background:linear-gradient(155deg,var(--c-dep),var(--c-dep2));}
.sq.process{background:linear-gradient(155deg,var(--c-process),var(--c-process2));}
.sq.go{background:linear-gradient(155deg,var(--c-go),#2a4252); justify-content:center;}
.sq.chance{background:linear-gradient(155deg,var(--c-chance),#3f3560); justify-content:center;}
.sq.fate{background:linear-gradient(155deg,var(--c-fate),#6a3550); justify-content:center;}
.sq.rest{background:linear-gradient(155deg,var(--c-rest),#2a5d52); justify-content:center;}
.sq.challenge::after{content:"★"; position:absolute; top:3px; right:5px; color:var(--gold);
  font-size:12px; text-shadow:0 0 4px rgba(0,0,0,.6);}
.sq .big{font-size:14px; font-weight:800; text-shadow:0 1px 3px rgba(0,0,0,.6);}
/* 難度徽章 */
.sq .diff{position:absolute; top:3px; left:5px; font-size:8px; font-weight:800;
  padding:1px 5px; border-radius:8px; letter-spacing:.3px; color:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.45);}
.sq .diff.d1{background:linear-gradient(135deg,#3aa86b,#2e8a59);}
.sq .diff.d2{background:linear-gradient(135deg,#d39a2e,#b97f1c);}
.sq .diff.d3{background:linear-gradient(135deg,#c0492f,#a2361f);}
/* 中央 */
#center{position:absolute; left:14.28%; top:14.28%; width:57.14%; height:57.14%;
  background:linear-gradient(160deg,rgba(244,248,251,.97),rgba(230,240,246,.95));
  border-radius:14px; padding:12px 14px; display:flex; flex-direction:column;
  box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.8);}
#center h2{margin:0 0 4px; color:var(--accent); font-size:16px;}
#center .tip{font-size:11px; color:#5a7; margin-bottom:6px;}
#log{flex:1; overflow-y:auto; font-size:11px; color:#345; line-height:1.55;
  border-top:1px dashed #bcd; padding-top:6px;}
#log div{padding:1px 0;}
/* 棋子 */
#tokens{position:absolute; inset:0; pointer-events:none;}
.token{position:absolute; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:11px;
  box-shadow:0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
  border:2px solid rgba(255,255,255,.9); transition:left .5s ease, top .5s ease;}
/* 側欄 */
#panel{width:300px; max-width:92vw; background:var(--paper); border-radius:14px; padding:14px;
  color:var(--ink); box-shadow:0 10px 30px rgba(0,0,0,.4);}
.players{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
.prow{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; background:#e9eef3;}
.prow.active{outline:3px solid var(--gold); background:#fff5db;}
.prow.done{opacity:.5;}
.dot{width:18px; height:18px; border-radius:50%; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.pname{flex:1; font-weight:700; font-size:13px;}
.pscore{font-weight:800; color:var(--accent);}
.pbadge{font-size:9px; color:#fff; background:var(--accent); border-radius:10px; padding:1px 6px;}
#diceBox{display:flex; align-items:center; gap:12px; justify-content:center; margin:8px 0;}
#dice{width:54px; height:54px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center;
  font-size:28px; color:var(--accent); box-shadow:inset 0 0 0 2px #ccc, 0 2px 6px rgba(0,0,0,.2);
  transition:transform .25s;}
.roll{background:var(--accent); color:#fff; border:none; padding:12px 18px; border-radius:10px;
  font-size:15px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #1d5870;}
.roll:active{transform:translateY(2px); box-shadow:0 2px 0 #1d5870;}
.roll:disabled{opacity:.45; cursor:not-allowed; box-shadow:0 4px 0 #9bb;}
.ghost{background:#e1e8ef; color:#345; border:none; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:12px;}
.ghost:hover{background:#d2dbe5;}
.meta{font-size:12px; color:#567; text-align:center; margin:6px 0;}
.rules{font-size:11px; color:#456; background:#eef3f7; border-radius:8px; padding:8px 10px; margin-top:8px; line-height:1.6;}
.rules b{color:var(--accent);}
/* Modal */
.overlay{position:fixed; inset:0; background:rgba(5,15,25,.6); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:50; padding:14px;}
.overlay.show{display:flex;}
.card{background:var(--paper); border-radius:16px; max-width:500px; width:100%; padding:20px 22px;
  color:var(--ink); box-shadow:0 16px 50px rgba(0,0,0,.5); animation:pop .25s ease;}
@keyframes pop{from{transform:scale(.92); opacity:0;}to{transform:scale(1); opacity:1;}}
.card h3{margin:0 0 12px; color:var(--accent); font-size:18px;}
.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.mode-btn{background:#eaf1f6; border:2px solid #cdd8e2; border-radius:12px; padding:16px 10px;
  cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink);}
.mode-btn:hover{border-color:var(--accent); background:#e0f0f6;}
.mode-btn .mi{font-size:26px;}
.mode-btn b{font-size:14px;}
.mode-btn small{font-size:10px; color:#789;}
.online-form{margin-top:14px; border-top:1px dashed #bcd; padding-top:12px;}
.field{margin:10px 0;}
.field label{font-size:12px; font-weight:700; display:block; margin-bottom:4px; color:#456;}
.field input{width:100%; padding:9px; border-radius:8px; border:2px solid #ccd; font-size:14px;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}
.primary{background:var(--accent); color:#fff; border:none; padding:10px 14px; border-radius:10px;
  font-size:14px; font-weight:800; cursor:pointer; flex:1;}
.ghost.lobby{flex:0 0 auto;}
.hint{font-size:11px; color:#789; margin:8px 0 0;}
.room-code{font-size:15px; text-align:center; margin:6px 0;}
.room-code b{font-size:24px; color:var(--accent); letter-spacing:3px;}
.lobby-players{display:flex; flex-direction:column; gap:5px; margin-top:8px;}
.lobby-players .lp{display:flex; align-items:center; gap:8px; padding:6px 8px; background:#eef3f7; border-radius:8px; font-size:13px;}
#startBtn{flex:1;}
.q{font-size:15px; font-weight:700; line-height:1.5; margin-bottom:14px;}
.opt{display:block; width:100%; text-align:left; margin:7px 0; padding:10px 12px; border-radius:10px;
  border:2px solid #d2dae2; background:#fff; cursor:pointer; font-size:14px;}
.opt:hover{border-color:var(--accent); background:#f0f8fb;}
.opt.correct{background:#dcf5e1; border-color:#2a9d4f;}
.opt.wrong{background:#fde0e0; border-color:#c0392b;}
.opt:disabled{cursor:default;}
.explain{margin-top:12px; padding:10px 12px; background:#fff5db; border-radius:8px; font-size:13px; line-height:1.5; display:none;}
.explain.show{display:block;}
.cardbtn{margin-top:14px; width:100%; background:var(--accent); color:#fff; border:none; padding:11px;
  border-radius:10px; font-size:15px; font-weight:800; cursor:pointer; display:none;}
.cardbtn.show{display:block;}
.cardtext{font-size:15px; line-height:1.7;}
.cardtag{display:inline-block; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:800; color:#fff; margin-bottom:8px;}
.winner{font-size:22px; font-weight:900; color:var(--gold); text-align:center; margin:6px 0;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(20,40,60,.95);
  color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; z-index:80; opacity:0; pointer-events:none; transition:opacity .3s;}
.toast.show{opacity:1;}
@media(max-width:560px){
  .sq .icon svg,.sq .icon .emoji{width:26px;height:26px;}
  .sq .nm{font-size:8px;}
  #center h2{font-size:13px;}
}

</style>
</head>
<body>
<div id="bg"></div>
<h1>🌊 河流與海岸大富翁</h1>
<p class="subtitle">DSE 地理「河流與海岸」 · 你 vs 3 個 AI 地理學家</p>

<!-- 模式選擇 -->
<!-- 遊戲主畫面 -->
<div class="wrap" id="gameWrap">
  <div id="boardArea">
    <div id="board"></div>
    <div id="center">
      <h2>河流與海岸</h2>
      <div class="tip">沿河而上，臨海而下。</div>
      <div id="log"></div>
    </div>
    <div id="tokens"></div>
  </div>
  <div id="panel">
    <div class="players" id="players"></div>
    <div id="diceBox"><div id="dice">🎲</div><button class="roll" id="rollBtn" onclick="actRoll()">擲骰前進</button></div>
    <div class="meta" id="metaInfo"></div>
    <button class="ghost" style="width:100%" onclick="toggleRules()">📖 玩法說明</button>
    <button class="ghost" style="width:100%;margin-top:6px" onclick="exitGame()">🚪 離開對局</button>
    <div class="rules" id="rulesBox" style="display:none"></div>
  </div>
</div>

<!-- 題目 Modal -->
<div class="overlay" id="qOverlay">
  <div class="card">
    <h3 id="qTitle">知識題</h3>
    <div class="q" id="qText"></div>
    <div id="qOpts"></div>
    <div class="explain" id="qExplain"></div>
    <button class="cardbtn" id="qNext" onclick="closeQuestion()">繼續 ▶</button>
  </div>
</div>
<!-- 卡片 Modal -->
<div class="overlay" id="cOverlay">
  <div class="card">
    <span class="cardtag" id="cTag">機會</span>
    <div class="cardtext" id="cText"></div>
    <button class="cardbtn show" id="cBtn" onclick="confirmCard()">確定 ▶</button>
  </div>
</div>
<!-- 結算 Modal -->
<div class="overlay" id="winOverlay">
  <div class="card">
    <div class="winner" id="winText"></div>
    <div id="winDetail"></div>
    <button class="cardbtn show" onclick="setupOfflineGame()">再玩一次 🔄</button>
  </div>
</div>
<!-- 提示 -->
<div class="toast" id="toast"></div>

<script>
// 河流與海岸大富翁 — 立體感地貌圖示（SVG / emoji）

      {q:"連島沙洲（tombolo）連接的是？",o:["兩條河流","島嶼與大陸（或另一島）","兩個三角洲","海蝕崖與平台"],a:1,ex:"連島沙洲是堆積地貌，連接島嶼與大陸或另一島嶼。",past:true},
      {q:"有關『沿岸漂沙』與防波堤的關係，何者正確？",o:["防波堤會加強漂沙","防波堤改變水流，可使下游出現侵蝕","防波堤對漂沙無影響","只影響河口"],a:1,ex:"防波堤攔截沿岸漂沙，常使下游因泥沙減少而出現海岸侵蝕。"},
      {q:"維多利亞港屬於哪種海岸地形？",o:["河流上游峽谷","沉沒河谷（ria／淹沒河谷）","火山口湖","牛軛湖"],a:1,ex:"維多利亞港是沉沒河谷（ria）形成的天然良港，受潮汐影響。"},
      {q:"有關『海岸沙丘（coastal dune）』，何者正確？",o:["由河流下蝕形成","由強風將海灘沙粒吹積上岸而成","屬海蝕地貌","只出現於河口"],a:1,ex:"海岸沙丘由強風將海灘沙粒吹送上岸堆積而成，常見於植被稀少的海岸。"}
    ]
  }
};
const CHANCE = [{t:"戶外考察",x:"參加河流考察，知識大增！",eff:{coins:30}},{t:"暴雨氾濫",x:"河流氾濫被困。",eff:{coins:-20}},{t:"河口測量",x:"測量河口流速獲獎勵。",eff:{coins:25}},{t:"颱風",x:"颱風吹襲，跳過一回合。",eff:{skip:1}},{t:"迷路",x:"河谷迷路，倒退 2 格。",eff:{move:-2}},{t:"牛軛湖",x:"發現牛軛湖，心情大好！",eff:{coins:15}},{t:"沉積驚喜",x:"三角洲採得珍貴樣本！",eff:{coins:20}},{t:"順流而下",x:"加速前進 2 格。",eff:{move:2}}];
const FATE = [{t:"地理大使",x:"當選地理大使，獲獎金！",eff:{coins:40}},{t:"海嘯警報",x:"後退 3 格。",eff:{move:-3}},{t:"研究委託",x:"研究海岸侵蝕獲經費。",eff:{coins:35}},{t:"測驗答錯",x:"被罰款。",eff:{coins:-25}},{t:"地理彩票",x:"大獎入袋！",eff:{coins:50}},{t:"船擱淺",x:"停留一回合。",eff:{skip:1}},{t:"沖積平原",x:"發現肥沃耕地獲利。",eff:{coins:28}},{t:"海岸退卻",x:"撤退 1 格。",eff:{move:-1}}];

// ===== 全域狀態 =====
let MODE = null; // 'offline' | 'online'
let players = [];     // 當前畫面玩家
let me = null;        // 我的玩家 id
let turn = 0;
let turnCount = 0;
let target = 200;
let gameOver = false;
let busy = false;     // 動畫/等待中
let ws = null;
let myId = "p_" + Math.random().toString(36).slice(2, 9);
let roomCode = null;
let offlineUsedQ = {};

// ===== UI 工具 =====
function $(id){return document.getElementById(id);}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function show(id){ const e=$(id); if(e) e.classList.add("show"); }
function hide(id){ const e=$(id); if(e) e.classList.remove("show"); }

function enterOffline(){
  MODE="offline";
  hide("modeScreen");
  setupOfflineGame();
}
function enterOnline(){
  $("onlineForm").style.display="block";
  // 顯示伺服器位址（同頁 = 與網頁同 host）
  $("srvAddr").textContent = location.host || "同頁";
}
function backToMode(){
  hide("winOverlay"); hide("lobbyScreen");
  if(ws){ try{ws.close();}catch(e){} ws=null; }
  $("gameWrap").style.display="none";
  show("modeScreen");
}
function exitGame(){
  if(MODE==="online" && ws){ ws.send(JSON.stringify({type:"restart"})); }
  backToMode();
}

// ===== 單機模式 =====
function setupOfflineGame(){
  MODE="offline";
  const myName = "你";
  players = [];
  players.push({id:myId, name:myName, color:PALETTE[0], token:TOKENS[0], pos:0, score:0, skip:0, ai:false});
  const aiNames=["AI 地理達人","AI 河谷博士","AI 海岸專家"];
  for(let i=0;i<3;i++){
    players.push({id:"ai"+i, name:aiNames[i], color:PALETTE[i+1], token:TOKENS[i+1], pos:0, score:0, skip:0, ai:true});
  }
  me=myId; turn=0; turnCount=0; target=200; gameOver=false; busy=false; offlineUsedQ={};
  $("gameWrap").style.display="flex";
  buildBoard();
  log("🚩 單機對局開始！你 vs 3 個 AI，目標 "+target+" 地理幣。");
  updatePanel();
  // 若首回合是 AI，自動
  maybeAI();
}

function maybeAI(){
  if(gameOver) return;
  const p=players[turn];
  if(p.ai){ busy=true; setTimeout(()=>offlineRoll(p),700); }
}

function offlineRoll(p){
  if(p.skip>0){ p.skip--; log(`⏸️ ${p.name} 跳過回合`); offlineFinishTurn(); return; }
  const steps=1+Math.floor(Math.random()*6);
  showDice(steps);
  const old=p.pos; const np=(old+steps)%24; p.pos=np;
  if(np<old){ p.score+=50; log(`🏁 ${p.name} 經過起點 +50`); }
  log(`🎲 ${p.name} 擲出 ${steps}`);
  positionTokens();
  updatePanel();
  setTimeout(()=>offlineLanding(p),500);
}

function offlineLanding(p){
  const sq=BOARD[p.pos];
  if(sq.type==="go"){ log(`🏠 ${p.name} 抵達起點`); offlineFinishTurn(); return; }
  if(sq.type==="rest"){ p.score+=10; log(`🎓 ${p.name} 學院補給 +10`); updatePanel(); offlineFinishTurn(); return; }
  if(sq.type==="chance"){ offlineCard(p,"chance"); return; }
  if(sq.type==="fate"){ offlineCard(p,"fate"); return; }
  offlineAsk(sq,p);
}

function pickQ(cat, d){
  const key=cat+"_"+d;
  if(!offlineUsedQ[key]) offlineUsedQ[key]=[];
  const pool=Q[cat][d];
  if(offlineUsedQ[key].length>=pool.length) offlineUsedQ[key]=[];
  let idx; do{ idx=Math.floor(Math.random()*pool.length);}while(offlineUsedQ[key].includes(idx));
  offlineUsedQ[key].push(idx); return pool[idx];
}

function offlineAsk(sq,p){
  const q=pickQ(sq.cat, sq.d);
  const cfg=DIFF[sq.d];
  if(p.ai){
    busy=true;
    setTimeout(()=>{
      const willCorrect = Math.random() < cfg.pass;
      let choice;
      if(willCorrect) choice=q.a;
      else { do{ choice=Math.floor(Math.random()*q.o.length); }while(choice===q.a); }
      const correct=choice===q.a;
      if(correct){ p.score+=cfg.right; log(`✅ ${p.name} 答對 +${cfg.right}`);}
      else{ p.score=Math.max(0,p.score-cfg.wrong); log(`❌ ${p.name} 答錯 -${cfg.wrong}`);}
      updatePanel();
      offlineFinishTurn();
    },1100);
    return;
  }
  // 真人：顯示題目 Modal
  openQuestion(sq,q,(choice)=>{
    const correct=choice===q.a;
    if(correct){ p.score+=cfg.right; log(`✅ 你答對 +${cfg.right}`);}
    else{ p.score=Math.max(0,p.score-cfg.wrong); log(`❌ 你答錯 -${cfg.wrong}`);}
    updatePanel();
    if(offlineCheckWin()) return;
    offlineFinishTurn();
  });
}

function offlineCard(p,kind){
  const deck=kind==="chance"?CHANCE:FATE;
  const card=deck[Math.floor(Math.random()*deck.length)];
  if(p.ai){
    busy=true;
    setTimeout(()=>{ offlineApplyCard(p,card); offlineFinishTurn(); },900);
    return;
  }
  openCard(kind,card,()=>{
    offlineApplyCard(p,card);
    positionTokens();
    updatePanel();
    if(offlineCheckWin()) return;
    offlineFinishTurn();
  });
}
function offlineApplyCard(p,card){
  const e=card.eff;
  if(e.coins){ p.score=Math.max(0,p.score+e.coins); }
  if(e.skip){ p.skip+=e.skip; }
  if(e.move){ p.pos=((p.pos+e.move)%24+24)%24; }
  log(`${p.name}：${card.t}`);
}

function offlineCheckWin(){
  const w=players.find(p=>p.score>=target);
  if(w){ gameOver=true; busy=true; declareWinner(w,true); return true; }
  return false;
}
function offlineFinishTurn(){
  turnCount++;
  const maxTurns=players.length*8;
  if(offlineCheckWin()) return;
  if(turnCount>=maxTurns){
    let best=players[0]; players.forEach(p=>{if(p.score>best.score)best=p;});
    gameOver=true; busy=true; declareWinner(best,false); return;
  }
  turn=(turn+1)%players.length;
  busy=false;
  updatePanel();
  maybeAI();
}

// ===== 聯機模式 =====
function onlineCreate(){
  const name=$("myName").value.trim()||"玩家甲";
  connectWS(()=>{
    ws.send(JSON.stringify({type:"create", id:myId, name, maxPlayers:4, target:200}));
  });
}
function onlineJoin(){
  const code=$("joinCode").value.trim().toUpperCase();
  const name=$("myName").value.trim()||"玩家";
  if(!code){ toast("請輸入邀請碼"); return; }
  connectWS(()=>{
    ws.send(JSON.stringify({type:"join", code, id:myId, name}));
  });
}
function connectWS(onOpen){
  const proto = location.protocol==="https:"?"wss":"ws";
  const url = `${proto}://${location.host}`;
  ws = new WebSocket(url);
  ws.onopen = ()=>{ onOpen && onOpen(); };
  ws.onmessage = (ev)=>{
    let msg; try{ msg=JSON.parse(ev.data); }catch{ return; }
    handleServer(msg);
  };
  ws.onclose = ()=>{ toast("連線已斷開"); };
  ws.onerror = ()=>{ toast("無法連接伺服器"); };
}

function handleServer(msg){
  if(msg.type==="error"){ toast(msg.text); return; }
  if(msg.type==="sync"){
    roomCode = msg.code;
    players = msg.players;
    target = msg.target;
    turn = msg.turn||0;
    turnCount = msg.turnCount||0;
    gameOver = msg.gameOver;
    $("gameWrap").style.display = msg.started ? "flex" : "none";

    if(!msg.started){
      // 大廳
      show("lobbyScreen");
      $("roomCode").textContent = msg.code;
      const isHost = msg.host===myId;
      $("roomHost").textContent = isHost ? "（你是房主）":"";
      $("startBtn").style.display = isHost ? "block":"none";
      const lp=$("lobbyPlayers"); lp.innerHTML="";
      msg.players.forEach((p,i)=>{
        const d=document.createElement("div"); d.className="lp";
        d.innerHTML=`<span class="dot" style="background:${p.color}"></span>
          <b>${p.name}</b>${p.ai?' <span class="pbadge">AI</span>':''}
          ${msg.host===p.id?' 🛡':''}`;
        lp.appendChild(d);
      });
      // 邀請碼也放網址列方便分享
      try{ history.replaceState(null,"", "?room="+msg.code); }catch(e){}
      return;
    }
    hide("lobbyScreen");
    hide("modeScreen");
    buildBoard();
    positionTokens();
    updatePanel();
    if(msg.log) syncLog(msg.log);
    // 處理待回應事件
    if(msg.pendingEvent){ handlePending(msg.pendingEvent); }
    else { busy=false; }
    if(msg.gameOver){ busy=true; }
  }
}

function handlePending(ev){
  if(ev.kind==="question"){
    if(ev.playerId===myId){
      const sq = {ch:ev.isChallenge, cat:ev.cat};
      const q = {q:ev.question, o:ev.options, a:ev.answer, ex:ev.explain};
      openQuestion(sq,q,(choice)=>{
        ws.send(JSON.stringify({type:"answer", choice}));
      });
    } else { busy=true; }
  } else if(ev.kind==="card"){
    if(ev.playerId===myId){
      const card={t:ev.title, x:ev.text, eff:ev.eff};
      openCard(ev.cardKind,card,()=>{ ws.send(JSON.stringify({type:"card_confirm"})); });
    } else { busy=true; }
  }
}

function fillAI(){
  if(!ws) return;
  ws.send(JSON.stringify({type:"fill_ai", id:myId}));
}
function startGame(){
  if(!ws) return;
  ws.send(JSON.stringify({type:"start", id:myId}));
}
function copyCode(){
  const code=$("roomCode").textContent;
  const link = location.origin + "/?room=" + code;
  const txt = `河流與海岸大富翁！邀請碼：${code}\n連結：${link}`;
  navigator.clipboard?.writeText(txt).then(()=>toast("已複製邀請碼與連結！"));
}

// ===== 擲骰（統一入口） =====
function actRoll(){
  if(gameOver||busy) return;
  if(MODE==="offline"){
    const p=players[turn];
    if(p.ai) return;
    busy=true; offlineRoll(p);
  } else {
    if(players[turn] && players[turn].id===myId){
      ws.send(JSON.stringify({type:"roll"}));
      busy=true;
    }
  }
}

// ===== Modal：題目 =====
let _qResolve=null;
function openQuestion(sq,q,onDone){
  _qResolve=onDone;
  const cfg=DIFF[sq.d];
  $("qTitle").textContent = cfg.title + " · 難度" + cfg.tag;
  $("qText").textContent = (q.past?"📄 DSE 歷屆題型｜":"") + q.q;
  const box=$("qOpts"); box.innerHTML="";
  q.o.forEach((opt,oi)=>{
    const b=document.createElement("button"); b.className="opt";
    b.textContent = String.fromCharCode(65+oi) + ". " + opt;
    b.onclick=()=>onAnswer(b,oi,q); box.appendChild(b);
  });
  $("qExplain").className="explain"; $("qExplain").textContent="";
  $("qNext").className="cardbtn";
  show("qOverlay");
}
function onAnswer(btn,oi,q){
  document.querySelectorAll("#qOpts .opt").forEach(b=>b.disabled=true);
  document.querySelectorAll("#qOpts .opt")[q.a].classList.add("correct");
  if(oi!==q.a) btn.classList.add("wrong");
  $("qExplain").textContent=(oi===q.a?"✅ 答對！":"❌ 答錯。 ")+q.ex;
  $("qExplain").className="explain show";
  $("qNext").dataset.choice=oi;
  $("qNext").className="cardbtn show";
}
function closeQuestion(){
  hide("qOverlay");
  const choice=parseInt($("qNext").dataset.choice);
  const cb=_qResolve; _qResolve=null;
  if(cb) cb(choice);
}

// ===== Modal：卡片 =====
let _cResolve=null;
function openCard(kind,card,onDone){
  _cResolve=onDone;
  $("cTag").textContent=kind==="chance"?"🎲 機會":"🔮 命運";
  $("cTag").style.background=kind==="chance"?"#5b4b8a":"#8a4b6b";
  $("cText").innerHTML=`【${card.t}】<br>${card.x}`;
  show("cOverlay");
}
function confirmCard(){
  hide("cOverlay");
  const cb=_cResolve; _cResolve=null;
  if(cb) cb();
}

// ===== 結算 =====
function declareWinner(w,byTarget){
  $("winText").textContent="🏆 "+w.name+" 勝出！";
  let h='<div style="font-size:13px;line-height:1.7"><b>最終排名</b><br>';
  players.slice().sort((a,b)=>b.score-a.score).forEach((p,r)=>{
    h+=`${r+1}. ${p.name} — ${p.score} 地理幣<br>`;
  });
  h+=`<br>${byTarget?("率先達到 "+target+" 地理幣！"):("回合用盡，最高分獲勝！")}</div>`;
  $("winDetail").innerHTML=h;
  show("winOverlay");
}

// ===== 棋盤渲染 =====
function buildBoard(){
  const board=$("board"); board.innerHTML="";
  BOARD.forEach(s=>{
    const d=document.createElement("div"); d.id="sq-"+s.i;
    let cls="sq";
    if(s.type==="q"){ cls+=" "+s.cat+(s.ch?" challenge":""); }
    else cls+=" "+s.type;
    d.className=cls;
    d.style.gridRow=(s.r+1); d.style.gridColumn=(s.c+1);
    const ic = s.type==="q" ? (window.ICONS[s.icon]||"") : (window.SPECIAL_ICONS[s.icon]||"");
    const nameHtml = (s.type==="go"||s.type==="chance"||s.type==="fate"||s.type==="rest")
      ? `<span class="big">${s.name}</span>` : `<span class="nm">${s.name}</span>`;
    const diffHtml = (s.type==="q") ? `<span class="diff d${s.d}">難度 ${DIFF[s.d].tag}</span>` : "";
    d.innerHTML = `<div class="icon">${ic}</div>${nameHtml}${diffHtml}`;
    board.appendChild(d);
  });
  positionTokens();
}

function positionTokens(){
  const board=$("board");
  if(!board.firstChild) return;
  const brect=board.getBoundingClientRect();
  const layer=$("tokens"); layer.innerHTML="";
  const offs=[[-9,-9],[9,-9],[-9,9],[9,9]];
  players.forEach((p,i)=>{
    const sq=BOARD[p.pos];
    const el=$("sq-"+sq.i); if(!el) return;
    const sr=el.getBoundingClientRect();
    const cx=sr.left-brect.left+sr.width/2;
    const cy=sr.top-brect.top+sr.height/2;
    const t=document.createElement("div"); t.className="token";
    t.style.background=p.color;
    t.style.left=(cx-12+offs[i%4][0])+"px";
    t.style.top=(cy-12+offs[i%4][1])+"px";
    t.textContent=p.token;
    layer.appendChild(t);
  });
}
window.addEventListener("resize",positionTokens);

// ===== 面板 / 日誌 =====
function showDice(n){
  const d=$("dice"); d.textContent="🎲";
  d.style.transform="rotate("+(n*60+360)+"deg) scale(1.15)";
  setTimeout(()=>{ d.textContent=n; d.style.transform="rotate(0deg) scale(1)"; },200);
}
function updatePanel(){
  const box=$("players"); box.innerHTML="";
  players.forEach((p,i)=>{
    const row=document.createElement("div");
    row.className="prow"+(i===turn&&!gameOver?" active":"")+(p.skip>0?"":"");
    row.innerHTML=`<span class="dot" style="background:${p.color}"></span>
      <span class="pname">${p.token} ${p.name}${p.ai?' · AI':''}${p.id===myId?' (你)':''}</span>
      <span class="pscore">${p.score}</span>
      ${p.skip>0?'<span class="pbadge">跳'+p.skip+'</span>':''}`;
    box.appendChild(row);
  });
  const cur = players[turn];
  $("metaInfo").innerHTML=`目標 <b>${target}</b> 幣 ｜ 回合 ${turnCount}/${players.length*8} ｜ 輪到：<b>${cur?cur.name:''}</b>`;
  const myTurn = cur && cur.id===myId && !gameOver && !busy;
  $("rollBtn").disabled = !myTurn;
}
function log(msg){
  const l=$("log"); const d=document.createElement("div"); d.textContent="• "+msg;
  l.appendChild(d); l.scrollTop=l.scrollHeight;
}
function syncLog(arr){
  const l=$("log"); l.innerHTML="";
  // 只顯示最近 30 條
  arr.slice(-30).forEach(m=>{ const d=document.createElement("div"); d.textContent="• "+m; l.appendChild(d); });
  l.scrollTop=l.scrollHeight;
}
function toggleRules(){
  const b=$("rulesBox");
  if(b.style.display==="none"){
    b.style.display="block";
    b.innerHTML=`<b>目標：</b>答題賺地理幣，達 <b>${target}</b> 或回合用盡最高分勝。<br>
      <b>知識題</b>答對 +20；<b>挑戰題(★)</b>+35，答錯 -10；經過起點 +50；學院 +10。<br>
      <b>機會/命運</b>：隨機獎懲。<br>
      <b>聯機</b>：房主分享邀請碼，可補 AI 後開始。`;
  } else b.style.display="none";
}

// 啟動時若網址帶 ?room= 預填邀請碼
(function init(){
  setupOfflineGame();
})();

</script>
